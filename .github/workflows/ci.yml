name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test

  build-e2e:
    name: Database, build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # E2E uses the deterministic test tutor (replies are labelled "not AI");
      # the environment schema refuses this provider in production.
      TUTOR_PROVIDER: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Export local Supabase URL and key
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          rm supabase.env
      - name: Generated database types are up to date
        run: pnpm db:types:check
      - name: Row-level security and RPC integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Client bundle secret scan
        run: pnpm check:bundle
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.24.0 (checksum-verified)
        env:
          GITLEAKS_SHA256: cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --redact --verbose --exit-code 1
